<!DOCTYPE html>
<html>
<head>
    <title>Survey form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Survey form</h1>

    <div class="form">

        <p>Let us know how we can improve freeCodeCamp</p>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <label>Email:</label>
        <input type="email" placeholder="Enter your Email">
        <label>Age:</label>
        <input type="number" placeholder="Age">

        <label>Which option best describes your current role?</label>
        <select>
            <option>Student</option>
            <option>graduated</option>
        </select>

        <label>How likely is that you would recommend freeCodeCamp to a friend?</label>

        <div class="radio">
            <input type="radio" name="recommend"> Definitely 
            <input type="radio" name="recommend"> Maybe
            
            <input type="radio" name="recommend"> Not sure
        </div>

        <label>What do you like most in FCC:</label>
        <select>
            <option>Select an option</option>
            <option>Challenges</option>
            <option>Projects</option>
        </select>

        <label>Things that should be improved in the future:</label>

        <div class="check">
            <input type="checkbox"> Front-end Projects
            
            <input type="checkbox"> Back-end Projects
           
            <input type="checkbox"> Data Visualization
        </div>

    </div>

</body>
</html>
